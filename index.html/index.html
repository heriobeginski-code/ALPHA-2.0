<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID | ALPHA 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --grid-blue: #00E5FF; }
        body { 
            background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; min-height: 100vh;
            background-image: radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(0, 229, 255, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .mono { font-family: 'Roboto Mono', monospace; }
        .tron-glow { 
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.15); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tron-glow:hover { border-color: var(--grid-blue); box-shadow: 0 0 30px rgba(0, 229, 255, 0.2); }
        .hidden { display: none !important; }
        .task-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="selection:bg-cyan-500/30">

    <header class="border-b border-cyan-900/30 p-6 sticky top-0 bg-slate-950/80 backdrop-blur-xl z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="mono text-[10px] tracking-[0.4em] uppercase text-cyan-500/60 font-bold">Grid_Protocol // Alpha_2.0</h1>
            <div id="calendar-bar" class="flex gap-4 mono text-[10px]"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 pb-24">
        <div id="hub-view" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4">
                <div class="tron-glow p-6 rounded-sm sticky top-28">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="mono text-[10px] uppercase tracking-widest text-cyan-400 font-bold">Active Battlefield</h2>
                        <span id="task-count" class="text-[9px] text-slate-500 mono">0 UNITS</span>
                    </div>
                    <ul id="daily-list" class="space-y-3 mb-8 text-sm min-h-[50px]"></ul>
                    <div class="relative group">
                        <input type="text" id="quick-add" placeholder="INPUT COMMAND..." 
                               class="w-full bg-transparent border-b border-cyan-900/50 py-3 mono text-[10px] text-cyan-300 focus:outline-none focus:border-cyan-400 transition-all placeholder:text-slate-700 uppercase">
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-12">
                <div id="category-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                
                <div id="study-trigger" class="border border-dashed border-cyan-900/40 p-10 text-center cursor-pointer hover:bg-cyan-950/20 transition-all group rounded-sm">
                    <span class="mono tracking-[0.8em] text-cyan-500/30 group-hover:text-cyan-400 transition-all">INITIATE STUDY_PROTOCOL</span>
                </div>

                <div>
                    <h3 class="mono text-[9px] uppercase tracking-[0.3em] text-slate-500 mb-6 font-bold">Authorized Tools (The Armory)</h3>
                    <div id="subscription-grid" class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2"></div>
                </div>
            </div>
        </div>

        <div id="focus-view" class="hidden fixed inset-0 bg-slate-950 z-[100] flex">
            <aside class="w-64 border-r border-cyan-900/30 p-8 flex flex-col justify-between bg-slate-950">
                <div>
                    <h2 class="mono text-[10px] tracking-widest text-cyan-500/50 mb-10 font-bold uppercase">Study_Nodes</h2>
                    <nav id="study-nav" class="space-y-6"></nav>
                </div>
                <button id="exit-focus" class="mono text-[10px] text-red-500/60 hover:text-red-400 tracking-widest transition-all">TERMINATE_SESSION</button>
            </aside>
            <section class="flex-1 p-12 overflow-y-auto flex items-center justify-center">
                <div class="max-w-2xl w-full">
                    <div class="tron-glow p-12 rounded-sm text-center">
                        <h3 id="subject-title" class="text-4xl font-extralight text-cyan-50 mb-8 tracking-tight">System Standby</h3>
                        <p class="text-slate-500 text-sm mono leading-relaxed">Select a node from the sidebar to initialize learning protocols.</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const state = {
            dailyFocus: JSON.parse(localStorage.getItem('gridTasks')) || [],
            taskBank: {
                work: ["Instagram – Light", "AI Course – Theory", "Outreach", "Email Wipe", "App Dev Sync", "Social Media Strategy"],
                chores: ["Deep Clean House", "Inventory/Restock", "House Tidy", "Pets – Daily", "Grocery Run", "Laundry Cycle"],
                clients: ["Video Client A", "Video Client B", "App Dev Feedback", "Project Review"]
            },
            weeklyPlanner: { 
                MON: { mission: "Run + Client A" }, TUE: { mission: "Gym + App Dev" }, 
                WED: { mission: "Run + Client B" }, THU: { mission: "Gym + App Dev" }, 
                FRI: { mission: "Run + Client B" }, SAT: { mission: "Review + Prep" }, 
                SUN: { mission: "Gym + Job Apps" } 
            },
            study: [
                { name: "Mathematics", url: "https://www.khanacademy.org/math/" },
                { name: "AI Specialization", url: "https://platform.outskill.com/" },
                { name: "Language Protocol", url: "https://learn.mangolanguages.com/login" },
                { name: "Writing Analysis", url: "#" }
            ],
            subscriptions: [
                { name: "Perplexity", url: "https://www.perplexity.ai/" }, { name: "Canva", url: "https://www.canva.com/" },
                { name: "Julius AI", url: "https://julius.ai/" }, { name: "Lovable", url: "https://lovable.dev" },
                { name: "Lyzr Studio", url: "https://studio.lyzr.ai/" }, { name: "Fireflies", url: "https://app.fireflies.ai/" },
                { name: "Phot AI", url: "https://www.phot.ai" }, { name: "Hailuo AI", url: "https://hailuoai.video/" },
                { name: "Vapi", url: "https://dashboard.vapi.ai/" }, { name: "Writesonic", url: "https://app.writesonic.com/" },
                { name: "HeyGen", url: "https://app.heygen.com/" }, { name: "Chronicle", url: "https://app.chroniclehq.com/" },
                { name: "Happenstance", url: "https://happenstance.ai/" }, { name: "MultipleChat", url: "https://multiplechat.ai/" },
                { name: "Wispr Flow", url: "https://wisprflow.ai/" }, { name: "Retell AI", url: "https://www.retellai.com/" },
                { name: "ElevenLabs", url: "https://elevenlabs.io/" }, { name: "MeetEmily", url: "https://meetemily.ai/" },
                { name: "Bolt", url: "https://bolt.new/" }, { name: "LinkedIn", url: "https://www.linkedin.com/" },
                { name: "OpenAI", url: "https://openai.com/" }, { name: "Pinecone", url: "https://www.pinecone.io/" },
                { name: "n8n", url: "https://n8n.io/" }, { name: "Dify", url: "https://dify.ai/" },
                { name: "Gumloop", url: "https://www.gumloop.com/" }, { name: "G-Sheets", url: "https://docs.google.com/spreadsheets" },
                { name: "G-Labs", url: "https://labs.google/" }, { name: "NotebookLM", url: "https://notebooklm.google/" },
                { name: "Apify", url: "https://apify.com/" }, { name: "SocialSonic", url: "https://app.socialsonic.com/" },
                { name: "SuperGrow", url: "https://www.supergrow.ai/" }, { name: "VTurb", url: "https://app.vturb.com/" },
                { name: "Kiwify", url: "https://dashboard.kiwify.com.br/" }, { name: "GoDaddy", url: "https://dcc.godaddy.com/" },
                { name: "Hotmart", url: "https://app.hotmart.com/" }, { name: "Atomicat", url: "https://app.atomicat.com.br/" },
                { name: "Supabase", url: "https://supabase.com/dashboard/" }, { name: "Facebook", url: "https://www.facebook.com/" }
            ]
        };

        function save() {
            localStorage.setItem('gridTasks', JSON.stringify(state.dailyFocus));
            render();
        }

        function render() {
            // Task List
            document.getElementById('daily-list').innerHTML = state.dailyFocus.map(t => `
                <li class="flex justify-between items-center group border-l border-cyan-500/20 hover:border-cyan-400 pl-3 py-1 task-enter">
                    <span class="text-slate-400 text-xs uppercase mono">${t}</span>
                    <button onclick="removeTask('${t}')" class="opacity-0 group-hover:opacity-100 text-red-500/40 hover:text-red-400 text-[9px] transition-all">X</button>
                </li>
            `).join('') || '<li class="text-slate-700 italic text-[10px] mono">NO_ACTIVE_MISSIONS</li>';
            
            document.getElementById('task-count').innerText = `${state.dailyFocus.length} UNITS`;

            // Bank
            document.getElementById('category-grid').innerHTML = Object.entries(state.taskBank).map(([cat, tasks]) => `
                <div class="tron-glow p-5 rounded-sm">
                    <h3 class="mono text-[9px] text-cyan-500/40 mb-4 tracking-widest font-bold uppercase">${cat}</h3>
                    <div class="flex flex-wrap gap-2">
                        ${tasks.map(t => `<button onclick="addTask('${t}')" class="text-[10px] border border-cyan-900/40 px-3 py-1 text-slate-400 hover:border-cyan-400 hover:text-cyan-400 transition-all">+ ${t}</button>`).join('')}
                    </div>
                </div>
            `).join('');

            // Tools (Full Armory)
            document.getElementById('subscription-grid').innerHTML = state.subscriptions.map(tool => `
                <a href="${tool.url}" target="_blank" class="tron-glow aspect-square flex items-center justify-center text-[7px] mono text-slate-500 hover:text-cyan-400 text-center p-2 leading-tight uppercase">
                    ${tool.name}
                </a>
            `).join('');

            // Calendar
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const todayIndex = new Date().getDay();
            const today = days[todayIndex];
            document.getElementById('calendar-bar').innerHTML = Object.keys(state.weeklyPlanner).map(day => `
                <div class="flex flex-col items-center group cursor-help" title="${state.weeklyPlanner[day].mission}">
                    <span class="${day === today ? 'text-cyan-400 font-bold' : 'text-slate-700'}">${day}</span>
                    <div class="w-1 h-1 mt-1 ${day === today ? 'bg-cyan-400 shadow-[0_0_8px_#00E5FF]' : 'bg-transparent'}"></div>
                </div>
            `).join('');

            // Study
            document.getElementById('study-nav').innerHTML = state.study.map(s => `
                <button onclick="openStudy('${s.name}', '${s.url}')" 
                        class="block w-full text-left text-[10px] text-slate-500 hover:text-cyan-400 uppercase mono pl-4 border-l border-cyan-900/50 hover:border-cyan-400 py-1 transition-all">
                    ${s.name}
                </button>
            `).join('');
        }

        window.addTask = (t) => { if(!state.dailyFocus.includes(t)) { state.dailyFocus.push(t); save(); } };
        window.removeTask = (t) => { state.dailyFocus = state.dailyFocus.filter(x => x !== t); save(); };
        window.openStudy = (name, url) => {
            document.getElementById('subject-title').innerText = name;
            if(url !== '#') window.open(url, '_blank');
        };

        document.getElementById('study-trigger').onclick = () => document.getElementById('focus-view').classList.remove('hidden');
        document.getElementById('exit-focus').onclick = () => document.getElementById('focus-view').classList.add('hidden');
        
        document.getElementById('quick-add').addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && e.target.value) { addTask(e.target.value.trim()); e.target.value = ''; }
        });

        render();
    </script>
</body>
</html>
