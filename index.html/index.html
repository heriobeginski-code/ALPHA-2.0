<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID | ALPHA 2.0 (RESTORATION)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --grid-blue: #00E5FF; }
        body { 
            background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; min-height: 100vh;
            background-image: radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(0, 229, 255, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .mono { font-family: 'Roboto Mono', monospace; }
        .tron-glow { 
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.2); transition: all 0.4s ease;
        }
        .tron-glow:hover { border-color: var(--grid-blue); box-shadow: 0 0 25px rgba(0, 229, 255, 0.2); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="border-b border-cyan-900/40 p-6 sticky top-0 bg-slate-950/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="mono text-[10px] tracking-[0.4em] uppercase text-cyan-500/80">System_Active</h1>
            <div id="calendar-bar" class="flex gap-4 mono text-[10px]"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="hub-view" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4">
                <div class="tron-glow p-6 rounded-sm sticky top-28">
                    <h2 class="mono text-[10px] uppercase tracking-widest text-cyan-400 mb-6">Active Battlefield</h2>
                    <ul id="daily-list" class="space-y-4 mb-8 text-sm min-h-[50px]"></ul>
                    <input type="text" id="quick-add" placeholder="INPUT COMMAND..." 
                           class="w-full bg-transparent border-b border-cyan-900/50 py-2 mono text-[10px] text-cyan-300 focus:outline-none focus:border-cyan-400 transition-colors">
                </div>
            </div>
            <div class="lg:col-span-8 space-y-12">
                <div id="category-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                <div id="subscription-grid" class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-9 gap-2"></div>
            </div>
        </div>
    </main>

    <script>
        // DATA & LOGIC COMBINED
        const state = {
            dailyFocus: [],
            taskBank: {
                work: ["Instagram – Light", "AI Course", "Outreach"],
                chores: ["Clean House", "Pets – Daily", "Tidy"]
            },
            weeklyPlanner: { MON: "Client A", TUE: "App Dev", WED: "Client B", THU: "App Dev", FRI: "Client B", SAT: "Review", SUN: "Job Apps" },
            subscriptions: [{name:"Perplexity", url:"#"}, {name:"OpenAI", url:"#"}, {name:"Bolt", url:"#"}]
        };

        function render() {
            // Render Daily List
            document.getElementById('daily-list').innerHTML = state.dailyFocus.map(t => `
                <li class="flex justify-between text-slate-400 border-l border-cyan-500/30 pl-2">
                    ${t} <button onclick="removeTask('${t}')" class="text-red-500/50 text-[9px]">X</button>
                </li>
            `).join('') || '<li class="text-slate-700 italic text-xs">Waiting...</li>';

            // Render Task Bank
            document.getElementById('category-grid').innerHTML = Object.entries(state.taskBank).map(([cat, tasks]) => `
                <div class="tron-glow p-4">
                    <h3 class="mono text-[9px] text-cyan-500/50 mb-3 uppercase">${cat}</h3>
                    <div class="flex flex-wrap gap-2">
                        ${tasks.map(t => `<button onclick="addTask('${t}')" class="text-[10px] border border-cyan-900/40 px-2 py-1 hover:border-cyan-400">+ ${t}</button>`).join('')}
                    </div>
                </div>
            `).join('');

            // Render Calendar
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const today = days[new Date().getDay()];
            document.getElementById('calendar-bar').innerHTML = Object.keys(state.weeklyPlanner).map(day => `
                <span class="${day === today ? 'text-cyan-400' : 'text-slate-600'}">${day}</span>
            `).join('');
        }

        window.addTask = (t) => { if(!state.dailyFocus.includes(t)) state.dailyFocus.push(t); render(); };
        window.removeTask = (t) => { state.dailyFocus = state.dailyFocus.filter(x => x !== t); render(); };

        document.getElementById('quick-add').addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && e.target.value) { addTask(e.target.value); e.target.value = ''; }
        });

        render();
    </script>
</body>
</html>
