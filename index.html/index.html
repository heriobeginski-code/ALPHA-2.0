<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID | DEFINED_BLACKOUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700&family=Roboto+Mono:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon: #00E5FF; --bg: #000000; --panel-bg: rgba(8, 8, 8, 0.9); }
        
        body { 
            background-color: var(--bg); color: #ffffff; font-family: 'Inter', sans-serif; 
            overflow-x: hidden; min-height: 100vh;
        }

        /* HOLOGRAPHIC HALO - CENTER GLOW */
        .halo {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 900px; height: 900px; 
            background: radial-gradient(circle, rgba(0, 229, 255, 0.07) 0%, transparent 65%);
            z-index: -1; animation: halo-flow 15s infinite alternate ease-in-out;
        }
        @keyframes halo-flow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
        }

        /* DEFINED BORDERS - 1.5px */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            border: 1.5px solid rgba(0, 229, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel:hover {
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
        }

        /* INTERFACE ELEMENTS */
        .mono { font-family: 'Roboto Mono', monospace; }
        .hidden { display: none !important; }

        .btn-tactical {
            border: 1.5px solid rgba(0, 229, 255, 0.3);
            background: transparent;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.2s;
        }
        .btn-tactical:hover {
            background: var(--neon);
            color: #000;
            border-color: var(--neon);
            box-shadow: 0 0 15px var(--neon);
        }

        /* CUSTOM SCROLL FOR CHAT */
        #chat-output::-webkit-scrollbar { width: 5px; }
        #chat-output::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="selection:bg-cyan-500/30">
    <div class="halo"></div>

    <div id="hub-view" class="p-8 lg:p-16 max-w-[1700px] mx-auto">
        <header class="flex justify-between items-end mb-20 border-b-2 border-white/5 pb-10">
            <div>
                <h1 class="mono text-[10px] tracking-[0.8em] text-cyan-500 font-bold mb-4 uppercase">Neural_Network // v2.0</h1>
                <p class="text-7xl font-extralight tracking-tighter">OMNI_<span class="text-cyan-400 font-bold">CORE</span></p>
            </div>
            
            <div class="flex gap-12 items-center">
                <div class="glass-panel px-8 py-4 rounded-xl mono text-[10px]">
                    <p class="text-slate-500 mb-1">SYSTEM_LOAD</p>
                    <p id="system-load" class="text-cyan-400 font-bold">0%</p>
                </div>
                <div id="calendar-bar" class="flex gap-6 mono text-[11px] bg-black/40 p-4 rounded-xl border-1.5 border-white/5"></div>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <div class="lg:col-span-4">
                <div class="glass-panel p-10 rounded-3xl sticky top-12">
                    <div class="flex items-center gap-3 mb-10">
                        <div class="w-3 h-3 bg-cyan-500 rounded-sm"></div>
                        <h2 class="mono text-[11px] tracking-widest text-white uppercase font-bold">Directives</h2>
                    </div>
                    <ul id="daily-list" class="space-y-5 mb-12"></ul>
                    <input type="text" id="quick-add" placeholder="ADD_DIRECTIVE..." 
                           class="w-full bg-black/40 border-1.5 border-cyan-900/30 rounded-xl p-5 mono text-sm text-cyan-300 focus:outline-none focus:border-cyan-400 transition-all uppercase">
                </div>
            </div>

            <div class="lg:col-span-8 space-y-12">
                <div id="category-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
                
                <div onclick="toggleMode('study')" class="glass-panel p-16 rounded-3xl text-center cursor-pointer group relative overflow-hidden">
                    <div class="absolute inset-0 bg-cyan-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <p class="mono text-[10px] text-cyan-500/50 mb-4 tracking-[0.5em]">PROTOCOL_READY</p>
                    <h2 class="text-4xl font-light tracking-tight group-hover:scale-105 transition-transform">DEEP_STUDY_INTERFACE</h2>
                </div>

                <div id="subscription-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-9 gap-4"></div>
            </div>
        </main>
    </div>

    <div id="study-view" class="hidden fixed inset-0 z-[1000] bg-black flex flex-col">
        <nav class="p-8 border-b-2 border-white/5 flex justify-between items-center bg-black/90">
            <div class="flex items-center gap-4">
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_10px_#00E5FF]"></div>
                <h2 class="mono text-xs tracking-[0.4em] text-white font-bold uppercase">Neural_Link // Gemini_1.5</h2>
            </div>
            <button onclick="toggleMode('hub')" class="btn-tactical px-10 py-3 rounded-full text-[10px]">Disconnect_Session</button>
        </nav>
        
        <div class="flex flex-1 overflow-hidden">
            <aside class="w-80 border-r-2 border-white/5 p-10 bg-black/50">
                <h3 class="mono text-[9px] text-slate-500 mb-10 uppercase tracking-widest font-bold">Study_Nodes</h3>
                <nav id="study-nav" class="space-y-2"></nav>
                
                <div class="mt-24 glass-panel p-6 rounded-2xl">
                    <p class="mono text-[9px] text-cyan-500/60 mb-4 uppercase">Auth_Vault</p>
                    <input type="password" id="api-key" placeholder="PASTE_KEY..." class="w-full bg-black/60 border border-white/10 p-3 rounded-lg mono text-xs text-cyan-300 mb-4 focus:outline-none focus:border-cyan-500">
                    <button id="save-key-btn" class="w-full btn-tactical py-2 text-[8px] rounded-lg">Store_Identity</button>
                </div>
            </aside>

            <section class="flex-1 flex flex-col p-12 relative bg-[radial-gradient(circle_at_bottom,rgba(0,229,255,0.03),transparent)]">
                <div id="chat-output" class="flex-1 p-10 mono text-[14px] overflow-y-auto space-y-8 text-slate-300">
                    <p class="text-cyan-500/20 italic tracking-widest text-center mt-32">CONNECTION_STABLE: AWAITING_LOGIC_PROMPT</p>
                </div>
                <div class="mt-8 relative max-w-5xl mx-auto w-full">
                    <textarea id="ai-input" rows="2" placeholder="ENTER_COMMAND..." 
                              class="w-full bg-black border-2 border-white/10 rounded-2xl p-8 mono text-sm text-cyan-300 focus:border-cyan-500 transition-all resize-none"></textarea>
                    <button id="send-btn" class="absolute right-8 bottom-8 text-cyan-400 hover:text-white mono text-xs uppercase tracking-widest">Execute_⏎</button>
                </div>
            </section>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const appData = {
            taskBank: {
                logic: ["Instagram – Light", "AI Course", "Outreach", "Email Wipe"],
                domestic: ["Deep Clean", "House Tidy", "Pets – Daily", "Laundry"],
                ops: ["Client A", "Client B", "Review Sync"]
            },
            study: [
                { name: "Mathematics", prompt: "Generate a brief summary of a high-level math theorem." },
                { name: "AI Architecture", prompt: "Explain a transformer architecture concept briefly." },
                { name: "Language Sync", prompt: "Give me 5 useful advanced phrases in a random language." },
                { name: "NotebookLM", prompt: "Suggest a strategy for organizing study notes." }
            ],
            subscriptions: [
                { name: "Perp", url: "https://www.perplexity.ai/" }, { name: "Open", url: "https://openai.com/" },
                { name: "Bolt", url: "https://bolt.new/" }, { name: "Lova", url: "https://lovable.dev" },
                { name: "n8n", url: "https://n8n.io/" }
            ]
        };

        let state = JSON.parse(localStorage.getItem('gridTasks')) || { dailyFocus: [] };
        let apiKey = localStorage.getItem('gemini_key') || '';

        const save = () => { localStorage.setItem('gridTasks', JSON.stringify(state)); render(); };

        window.toggleMode = (m) => {
            document.getElementById('hub-view').classList.toggle('hidden', m === 'study');
            document.getElementById('study-view').classList.toggle('hidden', m === 'hub');
        };

        window.runGemini = async (p = null) => {
            const input = document.getElementById('ai-input');
            const output = document.getElementById('chat-output');
            const prompt = p || input.value;
            const key = document.getElementById('api-key').value || apiKey;

            if (!key) return alert("KEY_REQUIRED");
            if (!prompt || prompt === "COMMUNICATING...") return;

            output.innerHTML += `<div class="text-white/20 mono text-[10px] uppercase border-l-2 border-white/10 pl-4 mt-8">Prompt: ${prompt}</div>`;
            input.value = "COMMUNICATING...";

            try {
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                const result = await model.generateContent(prompt);
                const response = await result.response.text();
                
                output.innerHTML += `
                    <div class="bg-white/5 p-10 rounded-3xl border-1.5 border-white/10 text-slate-200 leading-relaxed animate-in fade-in duration-500">
                        <span class="text-cyan-400 font-bold mono text-[10px] uppercase mb-4 block">System_Output:</span>
                        ${response.replace(/\n/g, '<br>')}
                    </div>`;
                output.scrollTop = output.scrollHeight;
            } catch (e) {
                output.innerHTML += `<div class="text-red-500 mono">[ERROR]: ${e.message}</div>`;
            } finally { input.value = ""; }
        };

        window.addTask = (t) => { if(!state.dailyFocus.includes(t)) { state.dailyFocus.push(t); save(); } };
        window.removeTask = (t) => { state.dailyFocus = state.dailyFocus.filter(x => x !== t); save(); };

        function render() {
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const today = days[new Date().getDay()];
            document.getElementById('calendar-bar').innerHTML = days.map(d => `
                <div class="flex flex-col items-center">
                    <span class="${d === today ? 'text-cyan-400 font-bold' : 'text-slate-600'}">${d}</span>
                    <div class="w-1.5 h-1.5 rounded-full mt-2 ${d === today ? 'bg-cyan-400 shadow-[0_0_10px_#00E5FF]' : 'bg-white/5'}"></div>
                </div>
            `).join('');

            document.getElementById('daily-list').innerHTML = state.dailyFocus.map(t => `
                <li class="flex justify-between items-center group bg-white/5 p-4 rounded-xl border-l-4 border-cyan-500">
                    <span class="text-sm font-light uppercase tracking-wide text-white/80">${t}</span>
                    <button onclick="removeTask('${t}')" class="text-slate-700 hover:text-red-500 mono text-[9px] uppercase">Dismiss</button>
                </li>
            `).join('') || '<li class="text-slate-800 mono text-[10px] py-10 text-center border-1.5 border-dashed border-white/5 rounded-xl uppercase">Awaiting_Directives</li>';

            document.getElementById('category-grid').innerHTML = Object.entries(appData.taskBank).map(([cat, tasks]) => `
                <div class="glass-panel p-10 rounded-3xl">
                    <h3 class="mono text-[10px] text-cyan-500/40 mb-8 uppercase tracking-[0.4em] font-bold">${cat}</h3>
                    <div class="flex flex-wrap gap-4">
                        ${tasks.map(t => `<button onclick="addTask('${t}')" class="btn-tactical text-[9px] px-5 py-2.5 rounded-xl text-white/60 hover:text-white">+ ${t}</button>`).join('')}
                    </div>
                </div>
            `).join('');

            document.getElementById('subscription-grid').innerHTML = appData.subscriptions.map(tool => `
                <a href="${tool.url}" target="_blank" class="glass-panel aspect-square flex items-center justify-center text-[8px] mono text-slate-500 hover:text-cyan-400 p-2 text-center uppercase transition-all hover:scale-110 hover:border-cyan-500/50">
                    ${tool.name}
                </a>
            `).join('');

            document.getElementById('study-nav').innerHTML = appData.study.map(s => `
                <div onclick="window.runGemini('${s.prompt}')" 
                     class="text-[11px] mono text-slate-500 hover:text-white cursor-pointer uppercase py-4 border-l-2 border-transparent hover:border-cyan-500 pl-8 transition-all hover:bg-white/5">
                    ${s.name}
                </div>
            `).join('');

            document.getElementById('system-load').innerText = `${Math.min(100, state.dailyFocus.length * 12)}%`;
            if(apiKey) document.getElementById('api-key').value = apiKey;
        }

        document.getElementById('save-key-btn').onclick = () => {
            const k = document.getElementById('api-key').value;
            localStorage.setItem('gemini_key', k);
            apiKey = k;
            alert("KEY_IDENTITY_STORED");
        };

        document.getElementById('send-btn').onclick = () => window.runGemini();
        document.getElementById('ai-input').addEventListener('keydown', (e) => { 
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.runGemini(); } 
        });
        
        document.getElementById('quick-add').addEventListener('keypress', (e) => { 
            if(e.key === 'Enter' && e.target.value) { 
                window.addTask(e.target.value.trim()); 
                e.target.value=''; 
            } 
        });

        render();
    </script>
</body>
</html>
