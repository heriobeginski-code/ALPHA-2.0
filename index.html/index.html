<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID | ALPHA 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --grid-blue: #00E5FF; }
        body { 
            background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; min-height: 100vh;
            background-image: radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(0, 229, 255, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .mono { font-family: 'Roboto Mono', monospace; }
        .tron-glow { 
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.15); transition: all 0.4s ease;
        }
        .tron-glow:hover { border-color: var(--grid-blue); box-shadow: 0 0 30px rgba(0, 229, 255, 0.2); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="selection:bg-cyan-500/30">

    <header class="border-b border-cyan-900/30 p-6 sticky top-0 bg-slate-950/80 backdrop-blur-xl z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="mono text-[10px] tracking-[0.4em] uppercase text-cyan-500/60 font-bold">System_Active // V.2</h1>
            <div id="calendar-bar" class="flex gap-4 mono text-[10px]"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 pb-24">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4">
                <div class="tron-glow p-6 rounded-sm sticky top-28">
                    <h2 class="mono text-[10px] uppercase tracking-widest text-cyan-400 mb-6 font-bold">Daily Battlefield</h2>
                    <ul id="daily-list" class="space-y-3 mb-8 text-sm min-h-[50px]"></ul>
                    <input type="text" id="quick-add" placeholder="INPUT COMMAND..." 
                           class="w-full bg-transparent border-b border-cyan-900/50 py-3 mono text-[10px] text-cyan-300 focus:outline-none uppercase">
                </div>
            </div>
            <div class="lg:col-span-8 space-y-12">
                <div id="category-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                <div>
                    <h3 class="mono text-[9px] uppercase tracking-[0.3em] text-slate-500 mb-6 font-bold">The Armory</h3>
                    <div id="subscription-grid" class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-9 gap-2"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
