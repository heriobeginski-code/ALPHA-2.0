<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID | DARK MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --grid-blue: #00E5FF; }
        body { 
            background-color: #020617; 
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            /* Aurora Borealis Effect */
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 229, 255, 0.1) 0px, transparent 50%);
        }
        .mono { font-family: 'Roboto Mono', monospace; }
        .tron-glow { 
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tron-glow:hover { 
            border-color: var(--grid-blue);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="selection:bg-cyan-500/30">

    <header class="border-b border-cyan-900/50 p-6 sticky top-0 bg-slate-950/80 backdrop-blur-xl z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="mono text-[10px] tracking-[0.4em] uppercase text-cyan-500/70">Greetings, User</h1>
            <div id="calendar-bar" class="flex gap-4 mono text-[10px]"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="hub-view" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4">
                <div class="tron-glow p-6 rounded-sm sticky top-28">
                    <h2 class="mono text-[10px] uppercase tracking-widest text-cyan-400 mb-6">Active Battlefield</h2>
                    <ul id="daily-list" class="space-y-4 mb-8 text-sm"></ul>
                    <input type="text" id="quick-add" placeholder="INPUT COMMAND..." 
                           class="w-full bg-transparent border-b border-cyan-900 py-2 mono text-[10px] text-cyan-300 focus:outline-none focus:border-cyan-400 transition-colors placeholder:text-slate-700">
                </div>
            </div>

            <div class="lg:col-span-8 space-y-12">
                <div id="category-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                
                <div id="study-trigger" class="border border-dashed border-cyan-900 p-16 text-center cursor-pointer hover:bg-cyan-950/20 transition-all group rounded-sm">
                    <span class="mono tracking-[0.8em] text-cyan-500/50 group-hover:text-cyan-400">INITIATE STUDY_PROTOCOL</span>
                </div>

                <div>
                    <h2 class="mono text-[9px] uppercase tracking-[0.3em] text-slate-500 mb-6 font-bold">The Armory</h2>
                    <div id="subscription-grid" class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-9 gap-2"></div>
                </div>
            </div>
        </div>

        <div id="focus-view" class="hidden fixed inset-0 bg-slate-950 z-[100] flex">
            <aside class="w-64 border-r border-cyan-900/50 p-8 flex flex-col justify-between bg-slate-950">
                <nav id="study-nav" class="space-y-6"></nav>
                <button id="exit-focus" class="mono text-[10px] text-red-500/70 hover:text-red-400 uppercase tracking-widest">Terminate</button>
            </aside>
            <section class="flex-1 p-12 overflow-y-auto">
                <div id="focus-content" class="max-w-3xl mx-auto pt-20">
                    <div class="tron-glow p-10 rounded-sm">
                        <h3 id="subject-title" class="text-3xl font-extralight text-cyan-100 mb-6">Select Node</h3>
                        <div class="h-48 border-l border-cyan-900 pl-6 text-slate-500 italic text-sm flex items-center">Awaiting data...</div>
                    </div>
                </div>
            </section>
        </div>
    </main>

   <script src="app.js"></script>
</body>
</html>
