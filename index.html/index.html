<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --grid-blue: #00E5FF; }
        body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; }
        .mono { font-family: 'Roboto Mono', monospace; }
        .tron-glow { box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); border: 1px solid #F0F0F0; }
        .tron-glow:hover { box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); border-color: var(--grid-blue); }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .btn-blue { border: 1px solid var(--grid-blue); color: var(--grid-blue); transition: all 0.3s; }
        .btn-blue:hover { background: var(--grid-blue); color: white; box-shadow: 0 0 10px var(--grid-blue); }
    </style>
</head>
<body class="text-slate-900 overflow-x-hidden">
    <header id="pulse-header" class="border-b border-gray-100 p-6 sticky top-0 bg-white/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="mono text-xs tracking-[0.3em] uppercase">Greetings, User</h1>
            <div id="header-calendar" class="flex gap-4 overflow-x-auto"></div>
        </div>
    </header>

    <main id="app-container" class="max-w-7xl mx-auto p-6 transition-all duration-500">
        <div id="hub-view" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="tron-glow p-6 rounded-sm bg-white">
                    <h2 class="mono text-[10px] uppercase tracking-widest text-cyan-500 mb-4">Active Battlefield</h2>
                    <ul id="daily-list" class="space-y-3 mb-6 text-sm"></ul>
                    <input type="text" id="quick-add" placeholder="ADD TASK..." 
                           class="w-full bg-transparent border-b border-gray-200 py-2 mono text-xs focus:outline-none focus:border-cyan-400">
                </div>
            </div>

            <div class="lg:col-span-8 space-y-8">
                <div id="task-bank" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                
                <div id="study-trigger" class="border-2 border-dashed border-cyan-100 p-12 text-center cursor-pointer hover:bg-cyan-50 transition-all group">
                    <span class="mono tracking-[0.6em] text-cyan-400 group-hover:text-cyan-600">INITIATE STUDY_PROTOCOL</span>
                </div>

                <div class="pt-8">
                    <h2 class="mono text-[10px] uppercase mb-4 opacity-50">Authorized Tools</h2>
                    <div id="sub-grid" class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3"></div>
                </div>
            </div>
        </div>

        <div id="focus-view" class="hidden fixed inset-0 bg-white z-[100] flex">
            <aside class="w-64 border-r border-gray-100 p-8 flex flex-col justify-between">
                <div>
                    <h2 class="mono text-xs mb-8">SUBJECTS</h2>
                    <nav id="study-nav" class="space-y-4"></nav>
                </div>
                <button id="exit-focus" class="mono text-[10px] text-red-400 hover:text-red-600 text-left">TERMINATE SESSION</button>
            </aside>
            <section class="flex-1 p-12 overflow-y-auto">
                <div class="max-w-3xl mx-auto">
                    <div class="border border-cyan-100 p-8 rounded-sm mb-8">
                        <p class="mono text-[10px] text-cyan-500 mb-2">RAG AGENT // READY</p>
                        <h3 class="text-2xl font-light mb-4">How can I assist your review today?</h3>
                        <div class="h-64 bg-gray-50 rounded p-4 mb-4"></div>
                        <input type="text" class="w-full p-4 border border-gray-100 focus:outline-none focus:border-cyan-400" placeholder="Ask anything...">
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
