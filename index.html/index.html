<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --grid-blue: #00E5FF; }
        body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; }
        .mono { font-family: 'Roboto Mono', monospace; }
        .tron-glow { box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); border: 1px solid #F0F0F0; transition: all 0.3s ease; }
        .tron-glow:hover { box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); border-color: var(--grid-blue); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="text-slate-900">

    <header class="border-b border-gray-100 p-6 sticky top-0 bg-white/90 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="mono text-xs tracking-[0.4em] uppercase text-slate-400">Greetings, User</h1>
            <div id="calendar-bar" class="flex gap-4 mono text-[10px]">
                </div>
        </div>
    </header>

    <main id="main-content" class="max-w-7xl mx-auto p-6">
        <div id="hub-view" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4">
                <div class="tron-glow p-6 bg-white sticky top-28">
                    <h2 class="mono text-[10px] uppercase tracking-widest text-cyan-500 mb-6">Active Battlefield</h2>
                    <ul id="daily-list" class="space-y-4 mb-8 text-sm min-h-[100px]"></ul>
                    <input type="text" id="quick-add" placeholder="INPUT COMMAND..." 
                           class="w-full bg-transparent border-b border-gray-100 py-2 mono text-[10px] focus:outline-none focus:border-cyan-400 transition-colors">
                </div>
            </div>

            <div class="lg:col-span-8 space-y-12">
                <div id="category-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                
                <div id="study-trigger" class="border border-dashed border-cyan-200 p-16 text-center cursor-pointer hover:bg-cyan-50/50 transition-all group">
                    <span class="mono tracking-[0.8em] text-cyan-400 group-hover:text-cyan-600">INITIATE STUDY_PROTOCOL</span>
                </div>

                <div>
                    <h2 class="mono text-[9px] uppercase tracking-[0.3em] text-slate-300 mb-6">Authorized Tools</h2>
                    <div id="subscription-grid" class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-9 gap-2"></div>
                </div>
            </div>
        </div>

        <div id="focus-view" class="hidden fixed inset-0 bg-white z-[100] flex animate-fade-in">
            <aside class="w-64 border-r border-gray-100 p-8 flex flex-col justify-between h-full">
                <nav id="study-nav" class="space-y-6"></nav>
                <button id="exit-focus" class="mono text-[10px] text-red-400 hover:tracking-widest transition-all">TERMINATE_SESSION</button>
            </aside>
            <section class="flex-1 p-12 bg-slate-50/30">
                <div id="focus-content" class="max-w-2xl mx-auto pt-20 text-center">
                    <h2 class="mono text-cyan-500 mb-4 animate-pulse">PROTOCOL_ACTIVE</h2>
                    <h3 id="subject-title" class="text-4xl font-extralight tracking-tight text-slate-800">Select a Subject</h3>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
