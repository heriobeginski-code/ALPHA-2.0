<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID | CORE_OMNI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700&family=Roboto+Mono:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00E5FF; --bg: #020617; }
        
        body { 
            background-color: var(--bg);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Aurora Background */
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
            background: radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(0, 229, 255, 0.1) 0%, transparent 40%);
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Scanline HUD Effect */
        body::before {
            content: " ";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            z-index: 1000; pointer-events: none; opacity: 0.3;
        }

        .mono { font-family: 'Roboto Mono', monospace; }
        
        /* High-Tech Card Styles */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-top: 2px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-panel:hover {
            border-color: var(--neon);
            box-shadow: 0 0 40px -10px rgba(0, 229, 255, 0.3);
            transform: translateY(-4px);
        }

        /* Interactive Buttons */
        .btn-armory {
            background: rgba(0, 229, 255, 0.03);
            border: 1px solid rgba(0, 229, 255, 0.1);
            color: #94a3b8;
            transition: all 0.2s ease;
        }
        .btn-armory:hover {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--neon);
            color: var(--neon);
            text-shadow: 0 0 8px var(--neon);
        }

        input::placeholder { color: #334155; }
    </style>
</head>
<body>
    <div class="aurora-bg"></div>

    <header class="border-b border-cyan-900/30 p-8 sticky top-0 bg-slate-950/60 backdrop-blur-md z-[100]">
        <div class="max-w-7xl mx-auto flex justify-between items-end">
            <div>
                <h1 class="mono text-[10px] tracking-[0.6em] text-cyan-500 uppercase font-bold mb-1">Central_Interface</h1>
                <p class="text-4xl font-extralight tracking-tighter italic">ALPHA <span class="text-cyan-400 font-bold">2.0</span></p>
            </div>
            <div id="calendar-bar" class="flex gap-6 mono text-[11px]"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-8 pt-12 pb-32">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <div class="lg:col-span-5">
                <div class="glass-panel p-8 rounded-xl sticky top-36">
                    <div class="flex justify-between items-baseline mb-8 border-b border-cyan-950 pb-4">
                        <h2 class="mono text-[11px] uppercase tracking-[0.3em] text-cyan-400">Tactical_Objectives</h2>
                        <span id="unit-count" class="text-[10px] mono text-slate-600 italic">0 UNITS ACTIVE</span>
                    </div>
                    <ul id="daily-list" class="space-y-4 mb-10 min-h-[100px]"></ul>
                    <div class="relative group">
                        <input type="text" id="quick-add" placeholder="EXECUTE NEW COMMAND..." 
                               class="w-full bg-slate-900/50 border border-cyan-900/30 rounded-lg p-4 mono text-sm text-cyan-300 focus:outline-none focus:border-cyan-400 transition-all">
                        <div class="absolute right-4 top-4 text-cyan-900 group-focus-within:text-cyan-400 transition-colors">⏎</div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7 space-y-16">
                <div id="category-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                
                <section>
                    <h3 class="mono text-[10px] uppercase tracking-[0.4em] text-slate-500 mb-8 border-l-2 border-cyan-500 pl-4">The Armory // Hardware_Extensions</h3>
                    <div id="subscription-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-9 gap-3"></div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const appData = {
            taskBank: {
                core_work: ["Instagram – Light", "AI Course", "Outreach", "Email Wipe", "App Dev Sync"],
                domestics: ["Deep Clean", "House Tidy", "Pets – Daily", "Laundry Cycle"],
                client_ops: ["Video Client A", "Video Client B", "Review Session"]
            },
            weeklyPlanner: { MON: "Run + Client A", TUE: "Gym + App Dev", WED: "Run + Client B", THU: "Gym + App Dev", FRI: "Run + Client B", SAT: "Review", SUN: "Job Apps" },
            subscriptions: [
                { name: "Perp", url: "https://www.perplexity.ai/" }, { name: "Canv", url: "https://www.canva.com/" },
                { name: "Juli", url: "https://julius.ai/" }, { name: "Lova", url: "https://lovable.dev" },
                { name: "Lyzr", url: "https://studio.lyzr.ai/" }, { name: "Fire", url: "https://app.fireflies.ai/" },
                { name: "Phot", url: "https://www.phot.ai" }, { name: "HaiL", url: "https://hailuoai.video/" },
                { name: "Vapi", url: "https://dashboard.vapi.ai/" }, { name: "Sonic", url: "https://app.writesonic.com/" },
                { name: "HeyG", url: "https://app.heygen.com/" }, { name: "Chro", url: "https://app.chroniclehq.com/" },
                { name: "Happ", url: "https://happenstance.ai/" }, { name: "Multi", url: "https://multiplechat.ai/" },
                { name: "Wisp", url: "https://wisprflow.ai/" }, { name: "Rete", url: "https://www.retellai.com/" },
                { name: "11Lb", url: "https://elevenlabs.io/" }, { name: "Emily", url: "https://meetemily.ai/" },
                { name: "Bolt", url: "https://bolt.new/" }, { name: "LnkD", url: "https://www.linkedin.com/" },
                { name: "Open", url: "https://openai.com/" }, { name: "Pine", url: "https://www.pinecone.io/" },
                { name: "n8n", url: "https://n8n.io/" }, { name: "Dify", url: "https://dify.ai/" },
                { name: "GumL", url: "https://www.gumloop.com/" }, { name: "G-Sht", url: "https://docs.google.com/spreadsheets" },
                { name: "G-Lab", url: "https://labs.google/" }, { name: "Note", url: "https://notebooklm.google/" },
                { name: "Apify", url: "https://apify.com/" }, { name: "S-Son", url: "https://app.socialsonic.com/" },
                { name: "Supr", url: "https://www.supergrow.ai/" }, { name: "VTub", url: "https://app.vturb.com/" },
                { name: "Kiwif", url: "https://dashboard.kiwify.com.br/" }, { name: "GoDy", url: "https://dcc.godaddy.com/" },
                { name: "HotM", url: "https://app.hotmart.com/" }, { name: "Atom", url: "https://app.atomicat.com.br/" },
                { name: "Supa", url: "https://supabase.com/dashboard/" }, { name: "Face", url: "https://www.facebook.com/" }
            ]
        };

        let state = JSON.parse(localStorage.getItem('gridTasks')) || { dailyFocus: [] };

        function save() {
            localStorage.setItem('gridTasks', JSON.stringify(state));
            render();
        }

        function render() {
            // Calendar with high-tech spacing
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const today = days[new Date().getDay()];
            document.getElementById('calendar-bar').innerHTML = Object.keys(appData.weeklyPlanner).map(day => `
                <div class="flex flex-col items-center">
                    <span class="${day === today ? 'text-cyan-400 font-bold' : 'text-slate-700'}">${day}</span>
                    <div class="w-1.5 h-1.5 rounded-full mt-2 ${day === today ? 'bg-cyan-400 shadow-[0_0_10px_#00E5FF]' : 'bg-slate-900'}"></div>
                </div>
            `).join('');

            // Battlefield: Large, clear typography
            document.getElementById('daily-list').innerHTML = (state.dailyFocus || []).map(t => `
                <li class="flex justify-between items-center bg-slate-950/40 p-4 rounded-lg border-l-4 border-cyan-500 group animate-in slide-in-from-left">
                    <span class="text-sm font-light tracking-wide">${t.toUpperCase()}</span>
                    <button onclick="removeTask('${t}')" class="text-slate-700 hover:text-red-500 transition-colors mono text-xs">DISMISS</button>
                </li>
            `).join('') || '<li class="text-slate-800 italic text-sm p-4 border border-dashed border-slate-900 rounded-lg text-center">SYSTEM_IDLE: NO_ACTIVE_UNITS</li>';

            document.getElementById('unit-count').innerText = `${state.dailyFocus.length} UNITS ACTIVE`;

            // Bank: Glass Panels
            document.getElementById('category-grid').innerHTML = Object.entries(appData.taskBank).map(([cat, tasks]) => `
                <div class="glass-panel p-6 rounded-xl">
                    <h3 class="mono text-[10px] text-cyan-500/50 mb-6 uppercase tracking-widest font-bold">${cat}</h3>
                    <div class="flex flex-wrap gap-2">
                        ${tasks.map(t => `<button onclick="addTask('${t}')" class="btn-armory text-[10px] px-3 py-2 rounded uppercase mono font-medium">+ ${t}</button>`).join('')}
                    </div>
                </div>
            `).join('');

            // Armory: Polished micro-icons
            document.getElementById('subscription-grid').innerHTML = appData.subscriptions.map(tool => `
                <a href="${tool.url}" target="_blank" 
                   class="glass-panel aspect-square flex items-center justify-center text-[8px] mono text-slate-500 hover:text-cyan-400 text-center p-1 uppercase leading-tight font-bold">
                    ${tool.name}
                </a>
            `).join('');
        }

        window.addTask = (t) => { if(!state.dailyFocus.includes(t)) { state.dailyFocus.push(t); save(); } };
        window.removeTask = (t) => { state.dailyFocus = state.dailyFocus.filter(x => x !== t); save(); };

        document.getElementById('quick-add').addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && e.target.value) { window.addTask(e.target.value.trim()); e.target.value = ''; }
        });

        render();
    </script>
</body>
</html>
