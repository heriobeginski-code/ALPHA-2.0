<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID | ALPHA 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --grid-blue: #00E5FF; }
        body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; color: #1e293b; overflow-x: hidden; }
        .mono { font-family: 'Roboto Mono', monospace; }
        /* "Tron" aesthetic utilities */
        .tron-glow { box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); border: 1px solid #F0F0F0; transition: all 0.3s ease; }
        .tron-glow:hover { box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); border-color: var(--grid-blue); }
        .hidden { display: none !important; }
        /* Smooth Fade for View Transitions */
        .view-transition { transition: opacity 0.4s ease-in-out; }
    </style>
</head>
<body class="selection:bg-cyan-100">

    <header class="border-b border-gray-100 p-6 sticky top-0 bg-white/95 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="mono text-[10px] tracking-[0.4em] uppercase text-slate-400">Greetings, User</h1>
            <div id="calendar-bar" class="flex gap-4 mono text-[10px]">
                </div>
        </div>
    </header>

    <main id="main-content" class="max-w-7xl mx-auto p-6">
        
        <div id="hub-view" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4">
                <div class="tron-glow p-6 bg-white sticky top-28 rounded-sm">
                    <h2 class="mono text-[10px] uppercase tracking-widest text-cyan-500 mb-6 font-bold">Active Battlefield</h2>
                    <ul id="daily-list" class="space-y-4 mb-8 text-sm min-h-[100px]">
                        </ul>
                    <div class="relative">
                        <input type="text" id="quick-add" placeholder="INPUT COMMAND..." 
                               class="w-full bg-transparent border-b border-gray-100 py-2 mono text-[10px] focus:outline-none focus:border-cyan-400 transition-colors">
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-12">
                
                <div id="category-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
                
                <div id="study-trigger" class="border border-dashed border-cyan-200 p-16 text-center cursor-pointer hover:bg-cyan-50/50 transition-all group rounded-sm">
                    <span class="mono tracking-[0.8em] text-cyan-400 group-hover:text-cyan-600 animate-pulse">INITIATE STUDY_PROTOCOL</span>
                </div>

                <div class="pt-8">
                    <h2 class="mono text-[9px] uppercase tracking-[0.3em] text-slate-300 mb-6 font-bold">Authorized Tools (The Armory)</h2>
                    <div id="subscription-grid" class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-9 gap-2">
                        </div>
                </div>
            </div>
        </div>

        <div id="focus-view" class="hidden fixed inset-0 bg-white z-[100] flex overflow-hidden">
            <aside class="w-64 border-r border-gray-100 p-8 flex flex-col justify-between h-full bg-white">
                <div>
                    <h2 class="mono text-[10px] tracking-widest text-slate-400 mb-10 font-bold uppercase">Subjects</h2>
                    <nav id="study-nav" class="space-y-6">
                        </nav>
                </div>
                <button id="exit-focus" class="mono text-[10px] text-red-400 hover:tracking-widest transition-all text-left uppercase">Terminate_Session</button>
            </aside>

            <section class="flex-1 p-12 bg-slate-50/30 overflow-y-auto">
                <div class="max-w-3xl mx-auto pt-20">
                    <div class="border border-cyan-100 bg-white p-10 rounded-sm shadow-sm">
                        <p class="mono text-[10px] text-cyan-500 mb-4 animate-pulse uppercase">RAG_Agent // Active</p>
                        <h3 id="subject-title" class="text-3xl font-extralight tracking-tight text-slate-800 mb-6">Select a Node to Review</h3>
                        <div class="h-48 border-l-2 border-cyan-50 pl-6 text-slate-400 italic text-sm flex items-center">
                            Awaiting subject selection for session generation...
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
